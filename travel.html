<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Travel Budget Calculator - Needly</title>

  <meta name="description"
        content="Use Needly's free Travel Budget Calculator to estimate your total travel cost based on trip days, daily budget, and travel expenses.">

  <meta name="keywords"
        content="travel budget calculator, trip budget calculator, vacation budget calculator, travel cost calculator">

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .calculator {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .home {
      display: block;
      text-align: center;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 10px;
    }

  </style>

</head>


<body>

  <div class="calculator">

    <h1>✈️ Travel Budget Calculator</h1>

    <a class="home" href="index.html">
      ← Back to Home
    </a>


    <label>
      Number of Days
    </label>

    <input
      type="number"
      id="days"
      placeholder="7"
    >


    <label>
      Daily Budget ($)
    </label>

    <input
      type="number"
      id="daily"
      placeholder="100"
    >


    <label>
      Travel Cost ($)
    </label>

    <input
      type="number"
      id="travel"
      placeholder="300"
    >


    <button onclick="calculateTravel()">
      Calculate Travel Budget
    </button>


    <div id="result"></div>

  </div>


  <script>

    function calculateTravel() {

      const days =
        Number(document.getElementById("days").value);

      const daily =
        Number(document.getElementById("daily").value);

      const travel =
        Number(document.getElementById("travel").value);

      const result =
        document.getElementById("result");


      if (
        days <= 0 ||
        daily < 0 ||
        travel < 0
      ) {

        result.innerHTML =
          "<b>Please enter valid numbers.</b>";

        result.style.display = "block";

        return;
      }


      const dailyCost =
        days * daily;


      const total =
        dailyCost + travel;


      result.innerHTML =

        "<h3>🎯 Your Result</h3>" +

        "<p>Daily Expenses: <b>$" +
        dailyCost.toFixed(2) +
        "</b></p>" +

        "<p>Travel Cost: <b>$" +
        travel.toFixed(2) +
        "</b></p>" +

        "<p>Total Travel Budget: <b>$" +
        total.toFixed(2) +
        "</b></p>";


      result.style.display = "block";

    }

  </script>

</body>

</html>
