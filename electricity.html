<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Electricity Cost Calculator - Needly</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .calculator {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .home {
      display: block;
      text-align: center;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 10px;
    }

  </style>

</head>

<body>

  <div class="calculator">

    <h1>⚡ Electricity Cost Calculator</h1>

    <a class="home" href="index.html">
      ← Back to Home
    </a>

    <label>Electricity Usage (kWh)</label>

    <input
      type="number"
      id="usage"
      placeholder="Example: 300"
    >

    <label>Cost Per kWh ($)</label>

    <input
      type="number"
      id="rate"
      placeholder="Example: 0.15"
      step="0.01"
    >

    <button onclick="calculate()">
      Calculate Electricity Cost
    </button>

    <div id="result"></div>

  </div>


  <script>

    function calculate() {

      let usage =
        Number(document.getElementById("usage").value);

      let rate =
        Number(document.getElementById("rate").value);

      let result =
        document.getElementById("result");


      if (usage < 0 || rate < 0) {

        result.innerHTML =
          "Please enter valid numbers.";

        result.style.display = "block";

        return;
      }


      let monthlyCost = usage * rate;


      result.innerHTML =

        "<h3>🎯 Your Electricity Cost</h3>" +

        "<p>Estimated monthly cost: <b>$" +
        monthlyCost.toFixed(2) +
        "</b></p>";


      result.style.display = "block";

    }

  </script>

</body>

</html>
