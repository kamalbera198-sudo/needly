<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contact Us - Needly</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      color: #d1d5db;
      margin-top: 10px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .home {
      display: inline-block;
      margin-bottom: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 8px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

  </style>

</head>


<body>


  <header>

    <h1>Contact Us</h1>

    <p>
      We'd love to hear from you.
    </p>

  </header>


  <main class="container">


    <a
      class="home"
      href="index.html"
    >
      ← Back to Home
    </a>


    <div class="card">

      <h2>Send us a message</h2>

      <form onsubmit="sendMessage(event)">

        <label>Your Name</label>

        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >


        <label>Your Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >


        <label>Your Message</label>

        <textarea
          id="userMessage"
          placeholder="Write your message..."
          required
        ></textarea>


        <button type="submit">
          Send Message
        </button>

      </form>


      <div id="message">

        Thanks for contacting Needly!
        Your message has been received.

      </div>

    </div>


  </main>


  <footer>

    © 2026 Needly. All rights reserved.

  </footer>


  <script>

    function sendMessage(event) {

      event.preventDefault();

      document.getElementById("message")
        .style.display = "block";

      document.querySelector("form")
        .reset();

    }

  </script>


</body>

</html>
