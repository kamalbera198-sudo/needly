<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mortgage Calculator - Needly</title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .calculator {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .home {
      display: block;
      text-align: center;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 10px;
    }

  </style>

</head>

<body>

  <div class="calculator">

    <h1>🏠 Mortgage Calculator</h1>

    <a class="home" href="index.html">
      ← Back to Home
    </a>

    <label>Home Price ($)</label>

    <input
      type="number"
      id="price"
      placeholder="Example: 300000"
    >

    <label>Down Payment ($)</label>

    <input
      type="number"
      id="down"
      placeholder="Example: 60000"
    >

    <label>Interest Rate (%)</label>

    <input
      type="number"
      id="rate"
      step="0.01"
      placeholder="Example: 6.5"
    >

    <label>Loan Term (Years)</label>

    <input
      type="number"
      id="years"
      placeholder="Example: 30"
    >

    <button onclick="calculate()">
      Calculate Mortgage
    </button>

    <div id="result"></div>

  </div>


  <script>

    function calculate() {

      let price =
        Number(document.getElementById("price").value);

      let down =
        Number(document.getElementById("down").value);

      let rate =
        Number(document.getElementById("rate").value);

      let years =
        Number(document.getElementById("years").value);

      let result =
        document.getElementById("result");


      if (
        price <= 0 ||
        down < 0 ||
        down >= price ||
        rate < 0 ||
        years <= 0
      ) {

        result.innerHTML =
          "Please enter valid numbers.";

        result.style.display = "block";

        return;
      }


      let loan =
        price - down;


      let monthlyRate =
        rate / 100 / 12;


      let numberOfPayments =
        years * 12;


      let monthlyPayment;


      if (monthlyRate === 0) {

        monthlyPayment =
          loan / numberOfPayments;

      } else {

        monthlyPayment =
          loan *
          (
            monthlyRate *
            Math.pow(
              1 + monthlyRate,
              numberOfPayments
            )
          ) /
          (
            Math.pow(
              1 + monthlyRate,
              numberOfPayments
            ) - 1
          );

      }


      let totalPayment =
        monthlyPayment * numberOfPayments;


      let totalInterest =
        totalPayment - loan;


      result.innerHTML =

        "<h3>🎯 Mortgage Result</h3>" +

        "<p>Loan Amount: <b>$" +
        loan.toFixed(2) +
        "</b></p>" +

        "<p>Monthly Payment: <b>$" +
        monthlyPayment.toFixed(2) +
        "</b></p>" +

        "<p>Total Interest: <b>$" +
        totalInterest.toFixed(2) +
        "</b></p>" +

        "<p>Total Payments: <b>$" +
        totalPayment.toFixed(2) +
        "</b></p>";


      result.style.display = "block";

    }

  </script>

</body>

</html>
